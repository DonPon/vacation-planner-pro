<div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-black text-white tracking-tight">Add Family Member</h2>
    <button onclick="closeModal()" class="text-slate-500 hover:text-white transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>
</div>

<form action="/family/add-member" method="POST" class="space-y-4">
    <div class="space-y-1">
        <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Full Name</label>
        <input type="text" name="name" required placeholder="e.g. Alice Smith"
               class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white outline-none focus:ring-2 focus:ring-blue-500 transition-all">
    </div>

    <div class="grid grid-cols-2 gap-4">
        <div class="space-y-1">
            <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Country</label>
            <select name="country" id="country-select" required onchange="updateSubdivisions()"
                    class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white outline-none focus:ring-2 focus:ring-blue-500 transition-all appearance-none">
                <option value="" disabled selected>Select Country</option>
                {% for code, data in country_data.items() %}
                <option value="{{ code }}" class="bg-slate-900">{{ data.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="space-y-1">
            <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Region/Canton</label>
            <div class="relative">
                <select name="subdivision" id="subdivision-select" disabled
                        class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white outline-none focus:ring-2 focus:ring-blue-500 transition-all appearance-none disabled:opacity-30 disabled:cursor-not-allowed">
                    <option value="">N/A</option>
                </select>
                <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-slate-500" id="subdiv-arrow">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
        <div class="space-y-1">
            <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Annual Allowance (Days)</label>
            <input type="number" name="allowance" required value="25"
                   class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white outline-none focus:ring-2 focus:ring-blue-500 transition-all">
        </div>
        <div class="space-y-1">
            <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Working Days / Week</label>
            <input type="number" name="working_days" required value="5" max="7"
                   class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white outline-none focus:ring-2 focus:ring-blue-500 transition-all">
        </div>
    </div>

    <div class="space-y-1">
        <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Theme Color</label>
        <div class="flex items-center space-x-4">
            <input type="color" name="color" value="#3b82f6"
                   class="w-12 h-12 bg-transparent border-none cursor-pointer rounded-lg">
            <span class="text-xs text-slate-400 font-medium italic">Used for Timeline and Dashboard.</span>
        </div>
    </div>

    <div class="pt-4">
        <button type="submit" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-bold transition-all shadow-lg shadow-blue-500/20">
            Create Member
        </button>
    </div>
</form>

<script>
    const countryData = {{ country_data|tojson }};

    function updateSubdivisions() {
        const countrySelect = document.getElementById('country-select');
        const subdivSelect = document.getElementById('subdivision-select');
        const countryCode = countrySelect.value;
        const data = countryData[countryCode];

        // Clear existing options
        subdivSelect.innerHTML = '';

        if (data && Object.keys(data.subdivisions).length > 0) {
            subdivSelect.disabled = false;
            
            // Add default option
            const defaultOpt = document.createElement('option');
            defaultOpt.value = "";
            defaultOpt.text = "Select Region";
            defaultOpt.disabled = true;
            defaultOpt.selected = true;
            subdivSelect.appendChild(defaultOpt);

            for (const [code, name] of Object.entries(data.subdivisions)) {
                const opt = document.createElement('option');
                opt.value = code;
                opt.text = name;
                opt.className = "bg-slate-900";
                subdivSelect.appendChild(opt);
            }
        } else {
            subdivSelect.disabled = true;
            const opt = document.createElement('option');
            opt.value = "";
            opt.text = "N/A";
            subdivSelect.appendChild(opt);
        }
    }
</script>
