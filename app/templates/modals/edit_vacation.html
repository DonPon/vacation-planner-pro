<div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-black text-white tracking-tight">Edit Trip</h2>
    <button onclick="closeModal()" class="text-slate-500 hover:text-white transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>
</div>

<form action="/calendar/update-vacation/{{ vacation.id }}" method="POST" class="space-y-4">
    <div class="space-y-1">
        <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Family Member</label>
        <div class="relative">
            <select name="member_id" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white outline-none focus:ring-2 focus:ring-blue-500 transition-all appearance-none">
                {% for m in members %}
                <option value="{{ m.id }}" {% if vacation.member_id == m.id %}selected{% endif %} class="bg-slate-900">{{ m.name }}</option>
                {% endfor %}
            </select>
            <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-slate-500">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </div>
        </div>
    </div>

    <div class="space-y-1">
        <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Trip Title</label>
        <input type="text" name="title" value="{{ vacation.title or '' }}" placeholder="e.g. Summer Break"
               class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white outline-none focus:ring-2 focus:ring-blue-500 transition-all">
    </div>

    <div class="grid grid-cols-2 gap-4">
        <div class="space-y-1">
            <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Start Date</label>
            <input type="date" name="start_date" value="{{ vacation.start_date.isoformat() }}" required
                   class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white outline-none focus:ring-2 focus:ring-blue-500 transition-all">
        </div>
        <div class="space-y-1">
            <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">End Date</label>
            <input type="date" name="end_date" value="{{ vacation.end_date.isoformat() }}" required
                   class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white outline-none focus:ring-2 focus:ring-blue-500 transition-all">
        </div>
    </div>

    <div class="space-y-1">
        <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Notes (Optional)</label>
        <textarea name="notes" rows="3" placeholder="Flight details, hotel, etc..."
                  class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white outline-none focus:ring-2 focus:ring-blue-500 transition-all resize-none">{{ vacation.notes or '' }}</textarea>
    </div>

    <div class="pt-4 flex space-x-3">
        <button type="button" onclick="deleteVacation('vac-{{ vacation.id }}')" class="px-6 py-4 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded-2xl font-bold transition-all border border-red-500/20">
            Delete
        </button>
        <button type="submit" class="flex-1 py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-bold transition-all shadow-lg shadow-blue-500/20">
            Update Trip
        </button>
    </div>
</form>

<script>
    async function deleteVacation(taskId) {
        if (!confirm("Are you sure you want to delete this trip?")) return;
        const vacId = taskId.split('-')[1];
        const resp = await fetch(`/calendar/vacation/${vacId}`, { method: 'DELETE' });
        if (resp.ok) {
            closeModal();
            window.location.reload();
        }
    }
</script>
